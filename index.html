<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>잘 먹었습니다!</title>
<style>
@font-face {
  font-family: "GangwonEducationModuche";
  src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFLightA.woff") format("woff");
  font-weight: 300;
  font-display: swap;
}

@font-face {
  font-family: "GangwonEducationModuche";
  src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFBoldA.woff") format("woff");
  font-weight: 700;
  font-display: swap;
}

:root {
  --page: #F0EEE7;
  --paper: #FFFDF7;
  --paper-strong: #FFFFFF;
  --ink: #272621;
  --ink-soft: #6F6C63;
  --line-faint: #D9D5C9;
  --yellow: #F2DA55;
  --yellow-soft: #FFF4AE;
  --gray-wash: #ECE9E0;

  --line: 2px solid var(--ink);
  --line-heavy: 3px solid var(--ink);
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-round: 999px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  --font-display: "GangwonEducationModuche", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "GangwonEducationModuche", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-number: "GangwonEducationModuche", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

  --text-xs: 12px;
  --text-sm: 13px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 25px;
  --text-title: 38px;

  --ease-paper: cubic-bezier(.2, .75, .25, 1);
  --duration-fast: 100ms;
  --duration-normal: 180ms;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { word-break: keep-all; overflow-wrap: break-word; }

html, body, button, input, select, textarea {
  font-family: var(--font-body);
  font-weight: 300;
}
.screen-title, .chat-title, .title-main, .btn.primary, .timer-number,
.stat-value, .hud-number, .choice-num, .plate, strong {
  font-weight: 700;
}

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-size: var(--text-md);
  line-height: 1.6;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
}


/* ---------- GameShell ---------- */
.game-shell {
  position: relative;
  width: 100%;
  max-width: 460px;
  min-height: 100dvh;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
@media (min-width: 600px) {
  body { align-items: center; padding: var(--space-6) 0; }
  .game-shell {
    width: 420px;
    min-height: 0;
    height: min(844px, calc(100dvh - 48px));
    border: var(--line);
    border-radius: var(--radius-md);
    box-shadow: 0 6px 20px rgba(39, 38, 33, .08);
  }
}

.shell-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--space-4) 18px calc(var(--space-6) + env(safe-area-inset-bottom, 0px));
  padding-top: calc(var(--space-4) + env(safe-area-inset-top, 0px));
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
@media (max-width: 360px) {
  .shell-body { padding-left: var(--space-3); padding-right: var(--space-3); }
}

/* ---------- TopHUD ---------- */
.top-hud {
  position: sticky;
  top: 0;
  z-index: 8;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 52px;
  padding: var(--space-2) 18px;
  background: var(--paper);
  border-bottom: 1px solid var(--line-faint);
}
.top-hud[hidden] { display: none; }
.day-stamp {
  flex: none;
  padding: 5px 10px;
  border: var(--line);
  border-radius: var(--radius-md);
  background: var(--paper-strong);
  font-size: var(--text-sm);
  white-space: nowrap;
}
.hud-div { flex: none; width: 1px; height: 30px; background: var(--line-faint); }
.hud-gauge { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.hud-gauge-label { font-size: var(--text-xs); line-height: 1; }
.cell-meter { display: flex; gap: 3px; }
.cell {
  position: relative;
  width: 13px;
  height: 13px;
  flex: none;
  border: 2px solid var(--ink);
  border-radius: var(--radius-sm);
  background: var(--paper-strong);
  overflow: hidden;
}
.cell-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--yellow); }
.hud-meters { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.meter-row { display: flex; align-items: center; gap: var(--space-1); }
.meter-label { font-size: var(--text-xs); color: var(--ink-soft); width: 28px; flex: none; }
@media (max-width: 374px) {
  .top-hud { gap: var(--space-2); padding-left: var(--space-3); padding-right: var(--space-3); }
  .cell { width: 11px; height: 11px; }
  .cell-meter { gap: 2px; }
  .day-stamp, .goal-tag { padding: 4px 7px; }
  .meter-cell.lg { width: 40px; height: 40px; }
}
.meter {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 100%;
  border-radius: var(--radius-sm);
}
.meter.is-max { box-shadow: 0 0 0 2px var(--yellow); }
.meter-cell { display: block; width: 32px; height: 32px; }
.meter-cell.lg { width: clamp(40px, 12vw, 60px); height: clamp(40px, 12vw, 60px); }
.meter-num, .hud-number, .timer-number {
  font-family: var(--font-number);
  font-variant-numeric: tabular-nums;
}
.meter-num { font-size: var(--text-xs); color: var(--ink-soft); margin-left: var(--space-1); }
.goal-tag {
  flex: none;
  font-size: var(--text-sm);
  border: var(--line);
  border-radius: var(--radius-md);
  padding: 5px 10px;
  background: var(--paper-strong);
  white-space: nowrap;
}

/* ---------- Typography ---------- */
h1, h2, h3 { margin: 0; font-weight: 400; }
.title-main {
  font-family: var(--font-display);
  font-size: var(--text-title);
  line-height: 1.2;
  letter-spacing: .02em;
  text-align: center;
}
.screen-title { font-size: var(--text-xl); line-height: 1.3; margin-bottom: var(--space-2); }
.body-text { font-size: var(--text-md); line-height: 1.6; margin: 0 0 var(--space-2); }
.body-text:last-child { margin-bottom: 0; }
.sub-text { font-size: var(--text-sm); line-height: 1.5; color: var(--ink-soft); margin: 0; }
.center { text-align: center; }

/* ---------- Panel ---------- */
.panel {
  border: var(--line);
  border-radius: var(--radius-md);
  background: var(--paper-strong);
  padding: var(--space-3) var(--space-4);
}
.panel.plain { border: none; background: transparent; padding: 0; }
.panel + .panel { margin-top: var(--space-3); }

/* ---------- UI v2 에셋 ---------- */
.ui-icon {
  display: inline-block;
  flex: none;
  width: 40px;
  height: 40px;
  background-image: url("assets/thanksmeal/ui-v2/core-ui-icons.png");
  background-size: 400% 300%;
  background-repeat: no-repeat;
  mix-blend-mode: multiply;
  vertical-align: middle;
}
.ui-icon.heart    { background-position: 0% 0%; }
.ui-icon.star     { background-position: 33.333% 0%; }
.ui-icon.clock    { background-position: 66.667% 0%; }
.ui-icon.bowl     { background-position: 100% 0%; }
.ui-icon.pot      { background-position: 0% 50%; }
.ui-icon.chair    { background-position: 33.333% 50%; }
.ui-icon.calendar { background-position: 66.667% 50%; }
.ui-icon.phone    { background-position: 100% 50%; }
.ui-icon.bubble   { background-position: 0% 100%; }
.ui-icon.cutlery  { background-position: 33.333% 100%; }
.ui-icon.shop     { background-position: 66.667% 100%; }
.ui-icon.sparkle  { background-position: 100% 100%; }
.ui-icon.sm { width: 32px; height: 32px; }
.ui-icon.lg { width: 60px; height: 60px; }
.ui-icon.xl { width: 168px; height: 168px; }
/* 얼굴 자리를 대신하는 아이콘(전화·빈 의자)은 가족 얼굴 크기에 맞춰 원래 크기를 유지한다 */
.msg-face .ui-icon.lg, .seat-face .ui-icon.lg { width: 30px; height: 30px; }

.family-avatar {
  display: block;
  flex: none;
  width: 44px;
  height: 44px;
  object-fit: contain;
  mix-blend-mode: multiply;
  user-select: none;
  -webkit-user-drag: none;
}
.family-avatar--large { width: 64px; height: 64px; }

.title-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(4px, 1vh, 12px);
  width: 100%;
}
.title-logo {
  display: block;
  width: 98%;
  height: auto;
  object-fit: contain;
  mix-blend-mode: multiply;
  user-select: none;
  -webkit-user-drag: none;
}
.start-decoration {
  display: block;
  width: 48%;
  height: auto;
  object-fit: contain;
  mix-blend-mode: multiply;
  user-select: none;
  -webkit-user-drag: none;
}
.face-row {
  display: flex;
  justify-content: center;
  gap: var(--space-3);
  flex-wrap: wrap;
}
.face-col { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); }
.face-col .name { font-size: var(--text-sm); }
.face-box {
  display: grid;
  place-items: center;
  border: var(--line);
  border-radius: var(--radius-md);
  background: var(--paper-strong);
  padding: 2px;
}

/* ---------- 시작 화면 ---------- */
.title-scene {
  flex: 1;
  justify-content: space-between;
  gap: clamp(6px, 1.5vh, 14px);
  padding: clamp(4px, 1vh, 12px) 0 0;
}
.title-scene .face-row { gap: var(--space-2); }
.title-scene .face-box { width: clamp(48px, 12vw, 58px); height: clamp(48px, 12vw, 58px); }
.title-scene .face-box .family-avatar { width: clamp(40px, 10.5vw, 50px); height: clamp(40px, 10.5vw, 50px); }
.title-scene .face-col .name { font-size: var(--text-md); }
.title-question { font-size: var(--text-lg); text-align: center; }
.btn.hero {
  font-size: var(--text-xl);
  line-height: 1.2;
  padding: 16px var(--space-4);
  min-height: 66px;
  border-radius: var(--radius-lg);
}
.title-caption { font-size: var(--text-sm); text-align: center; color: var(--ink); }
@media (max-width: 360px) {
  .btn.hero { font-size: var(--text-lg); min-height: 58px; }
}

/* ---------- Scene ---------- */
.scene { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
.scene.fill { flex: 1; justify-content: center; }
.scene-caption { font-size: var(--text-sm); color: var(--ink-soft); text-align: center; }
.scene-art {
  position: relative;
  display: inline-grid;
  place-items: center;
  margin: var(--space-4) 0;
}
.scene-art > .ui-icon { position: relative; z-index: 1; }
.scene-art.highlight::before {
  content: "";
  position: absolute;
  width: 224px;
  height: 224px;
  background: var(--yellow-soft);
  border-radius: 50%;
  transform: rotate(-3deg);
  z-index: 0;
}

/* ---------- Buttons ---------- */
.btn {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: 12px var(--space-4);
  background: var(--paper-strong);
  color: var(--ink);
  border: var(--line);
  border-radius: var(--radius-md);
  font: inherit;
  font-size: var(--text-md);
  line-height: 1.25;
  text-align: left;
  cursor: pointer;
  transition: transform var(--duration-fast) var(--ease-paper),
              background-color var(--duration-fast) var(--ease-paper),
              box-shadow var(--duration-fast) var(--ease-paper);
}
.btn:hover:not([disabled]) { transform: translateY(-1px); box-shadow: 0 3px 0 -1px var(--yellow); }
.btn:active:not([disabled]) { transform: translateY(1px); box-shadow: none; }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn[disabled] {
  cursor: default;
  opacity: .55;
  transform: none;
  box-shadow: none;
  background-image: repeating-linear-gradient(-45deg, transparent 0 4px, var(--gray-wash) 4px 7px);
}
.btn.is-selected { background: var(--yellow); opacity: 1; background-image: none; }
.btn.is-selected .key { font-weight: 400; }
.btn.primary { background: var(--yellow); text-align: center; }
.btn.secondary { text-align: center; }
.btn.ghost {
  border: none;
  background: transparent;
  min-height: 44px;
  text-align: center;
  font-size: var(--text-sm);
  color: var(--ink-soft);
  text-decoration: underline;
  padding: 10px;
}
.btn.ghost:hover:not([disabled]) { box-shadow: none; color: var(--ink); }
.btn .key { display: inline-block; min-width: 1.5em; }
.btn .check { float: right; }

.action-area { margin-top: auto; padding-top: var(--space-2); display: flex; flex-direction: column; gap: var(--space-2); }

/* ---------- 하단 보조 메뉴 ---------- */
.main-secondary-menu {
  display: flex;
  border: var(--line);
  border-radius: var(--radius-md);
  background: var(--paper-strong);
  overflow: hidden;
  margin-top: var(--space-1);
}
.secondary-menu-item {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 48px;
  padding: 10px var(--space-2);
  background: none;
  border: none;
  font: inherit;
  font-size: var(--text-sm);
  color: var(--ink);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-paper);
}
.secondary-menu-item:hover { background: var(--yellow-soft); }
.secondary-menu-item:active { background: var(--yellow); }
.secondary-menu-item:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.secondary-menu-item .menu-icon { font-size: var(--text-lg); line-height: 1; }
.secondary-menu-divider {
  width: 1px;
  align-self: stretch;
  margin: 8px 0;
  background: var(--line-faint);
}

/* FloatingTool */
.tool-btn {
  position: absolute;
  right: var(--space-3);
  bottom: var(--space-3);
  width: 44px;
  height: 44px;
  border: var(--line);
  border-radius: var(--radius-round);
  background: var(--paper-strong);
  font: inherit;
  font-size: var(--text-md);
  line-height: 1;
  cursor: pointer;
  z-index: 9;
}
.tool-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.tool-btn[hidden] { display: none; }

/* ---------- Chat ---------- */
.chat-head {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--line-faint);
}
.chat-title { font-size: var(--text-xl); line-height: 1.3; text-align: center; }
.face-row.roster { gap: var(--space-2); }
.face-row.roster .face-box { width: 54px; height: 54px; }
.face-row.roster .face-box .family-avatar { width: 46px; height: 46px; }
@media (max-width: 360px) {
  .face-row.roster .face-box { width: 46px; height: 46px; }
  .face-row.roster .face-box .family-avatar { width: 40px; height: 40px; }
}
.answer-wrap { margin-top: auto; padding-top: var(--space-3); }
.chat { display: flex; flex-direction: column; gap: var(--space-3); }
.msg { display: flex; gap: var(--space-2); align-items: flex-start; animation: msgIn 140ms var(--ease-paper) both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg-face {
  flex: none;
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border: var(--line);
  border-radius: var(--radius-lg);
  background: var(--paper-strong);
  overflow: hidden;
}
.msg-face .family-avatar { width: 40px; height: 40px; }
.msg-body { flex: 1; min-width: 0; }
.msg-name { font-size: var(--text-sm); color: var(--ink-soft); margin-bottom: 2px; }
.msg-line { display: flex; align-items: flex-end; gap: var(--space-2); }
.msg-time { flex: none; font-size: var(--text-xs); color: var(--ink-soft); padding-bottom: 2px; }
.msg.from-me .msg-line { flex-direction: row-reverse; }
.msg-strip {
  position: relative;
  border: var(--line);
  border-radius: var(--radius-lg);
  background: var(--paper-strong);
  padding: var(--space-2) var(--space-3);
  font-size: var(--text-md);
  line-height: 1.6;
}
.msg-strip::before {
  content: "";
  position: absolute;
  left: -8px;
  top: 14px;
  width: 0; height: 0;
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  border-right: 8px solid var(--ink);
}
.msg.is-latest .msg-strip::after {
  content: "";
  position: absolute;
  left: var(--space-3);
  bottom: -6px;
  width: 44px;
  height: 3px;
  background: var(--yellow);
}
.msg.from-me { flex-direction: row-reverse; }
.msg.from-me .msg-name { text-align: right; }
.msg.from-me .msg-strip::before { left: auto; right: -8px; border-right: none; border-left: 8px solid var(--ink); }
.msg.from-me .msg-strip::after { left: auto; right: var(--space-3); }
.msg-note { font-size: var(--text-sm); color: var(--ink-soft); text-align: center; padding: var(--space-1) 0; }

.ink-dots { display: inline-flex; gap: 4px; align-items: center; height: 16px; }
.ink-dots i {
  width: 4px; height: 4px; border-radius: 50%; background: var(--ink-soft);
  animation: dot 720ms var(--ease-paper) infinite;
}
.ink-dots i:nth-child(2) { animation-delay: 120ms; }
.ink-dots i:nth-child(3) { animation-delay: 240ms; }
@keyframes dot { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* ---------- Timer + 선택지 패널 ---------- */
.answer-panel {
  border: var(--line-heavy);
  border-radius: var(--radius-lg);
  background: var(--paper-strong);
  padding: var(--space-3);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.timer {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}
.timer-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.timer-label { font-size: var(--text-sm); }
.timer-cells { display: flex; gap: var(--space-1); }
.timer-cell {
  width: 18px;
  height: 18px;
  border: 2px solid var(--ink);
  border-radius: var(--radius-sm);
  background: var(--yellow);
}
.timer-cell.is-empty { background: var(--paper-strong); }
.timer-sep { flex: none; width: 1px; align-self: stretch; background: var(--line-faint); }
.timer-number { font-size: 34px; line-height: 1; min-width: 1.1em; text-align: center; }
.timer.is-urgent .timer-number { animation: nudge 220ms var(--ease-paper) 1; }
.timer.is-urgent .timer-cell { box-shadow: inset 0 0 0 1px var(--ink); }
.choice-list { display: flex; flex-direction: column; gap: var(--space-2); }
.choice-num {
  flex: none;
  width: 26px;
  height: 26px;
  display: inline-grid;
  place-items: center;
  border: 2px solid var(--ink);
  border-radius: 50%;
  font-size: var(--text-sm);
  line-height: 1;
}
.btn.choice-btn {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 52px;
}
@keyframes nudge { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-2px); } 70% { transform: translateX(2px); } }

/* ---------- Choice cards (취향) ---------- */
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
@media (max-width: 360px) { .card-grid { grid-template-columns: 1fr; } }
.choice-card {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: 56px;
  padding: var(--space-3);
  border: var(--line);
  border-radius: var(--radius-md);
  background: var(--paper-strong);
  font: inherit;
  font-size: var(--text-md);
  text-align: left;
  cursor: pointer;
}
.choice-card:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.choice-card .scribble {
  position: absolute;
  left: 6px; right: 6px; top: 4px; bottom: 4px;
  background: var(--yellow-soft);
  border-radius: 50%;
  transform: rotate(-1.2deg);
  opacity: 0;
  transition: opacity var(--duration-fast) var(--ease-paper);
}
.choice-card.is-selected .scribble { opacity: 1; }
.choice-card > .label { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 14px; }
.choice-card .check { position: absolute; top: 4px; right: 8px; z-index: 1; font-size: var(--text-sm); }
.food-icon-wrap { width: 52px; height: 52px; display: grid; place-items: center; flex: 0 0 52px; }
.food-icon-wrap img { width: 100%; height: 100%; display: block; object-fit: contain; }
.food-emoji { width: 1.2em; height: 1.2em; object-fit: contain; vertical-align: -0.15em; flex: none; }
.menu-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.menu-tag { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.menu-tag__icon { width: 20px; height: 20px; flex: 0 0 20px; display: grid; place-items: center; }
.menu-tag__icon img { display: block; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; }

.step-count { font-size: var(--text-sm); color: var(--ink-soft); }

.day-rail { display: flex; gap: var(--space-2); overflow-x: auto; padding: var(--space-1) 2px var(--space-3); }
.day-card {
  position: relative;
  flex: none;
  width: 62px;
  min-height: 86px;
  padding: var(--space-2) 4px;

  border-radius: var(--radius-md);
  background: var(--paper-strong);
  font: inherit;
  font-size: var(--text-sm);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 2px;
  text-align: center;
}
.day-card:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.day-card.is-filled { background: var(--yellow-soft); }
.day-card .day-name { font-size: var(--text-md); }
.day-card .day-slot { font-size: var(--text-xs); color: var(--ink-soft); line-height: 1.3; }
.day-card .star { font-size: var(--text-sm); }
.day-remove {
  position: absolute;
  top: 2px; right: 2px;
  width: 26px; height: 26px;
  border: var(--line);
  border-radius: var(--radius-round);
  background: var(--paper-strong);
  font: inherit;
  font-size: var(--text-sm);
  line-height: 1;
  cursor: pointer;
  z-index: 2;
}
.day-remove::before { content: ""; position: absolute; inset: -8px; }
.day-remove:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.chip-row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip {
  min-height: 44px;
  padding: 10px var(--space-3);
  border: var(--line);
  border-radius: var(--radius-md);
  background: var(--paper-strong);
  font: inherit;
  font-size: var(--text-sm);
  cursor: pointer;
}
.chip:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.chip.is-selected { background: var(--yellow); }

/* ---------- Receipt (주간 메뉴) ---------- */
.receipt { border: var(--line); border-radius: var(--radius-md); background: var(--paper-strong); padding: var(--space-3); }
.receipt-row {
  display: grid;
  grid-template-columns: 46px 20px 1fr auto;
  align-items: center;
  gap: var(--space-2);
  padding: 7px 0;
  border-bottom: 1px dashed var(--line-faint);
  font-size: var(--text-sm);
}
.receipt-row:last-child { border-bottom: none; }
.menu-name.is-liked { box-shadow: inset 0 -7px 0 var(--yellow-soft); }
.menu-flag { font-size: var(--text-sm); }

/* ---------- Table scene ---------- */
.table-wrap { position: relative; width: 100%; padding: var(--space-3) 0 var(--space-4); }
.table-layout {
  position: relative;
  display: grid;
  grid-template-columns: 1fr minmax(120px, 1.4fr) 1fr;
  grid-template-rows: auto auto auto;
  gap: var(--space-2);
  align-items: center;
  justify-items: center;
}
.seat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  text-align: center;
  animation: stamp 160ms var(--ease-paper) both;
}
@keyframes stamp { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
.seat-face {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border: var(--line);
  border-radius: var(--radius-md);
  background: var(--paper-strong);
  overflow: hidden;
}
.seat-face .family-avatar { width: 42px; height: 42px; }
.seat.is-late .seat-face { opacity: .6; }
.seat.is-empty .seat-face { border-style: dashed; opacity: .5; }
.seat-name { font-size: var(--text-xs); line-height: 1.25; }
.seat-state { font-size: var(--text-xs); line-height: 1.25; color: var(--ink-soft); }
.seat.is-empty .seat-name { color: var(--ink-soft); }
.seat.pos-mom { grid-column: 2; grid-row: 1; flex-direction: column-reverse; }
.seat.pos-dad { grid-column: 1; grid-row: 2; }
.seat.pos-sib { grid-column: 3; grid-row: 2; }
.seat.pos-me  { grid-column: 2; grid-row: 3; }

.table-top {
  grid-column: 2;
  grid-row: 2;
  width: 100%;
  min-height: 104px;
  display: grid;
  place-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-2);
  border: var(--line);
  border-radius: var(--radius-md);
  background: var(--paper-strong);
  transform: rotate(-.3deg);
}
.table-dish { display: grid; place-items: center; }
.receipt-tag {
  background: var(--paper);
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--ink);
  border-left: 2px dashed var(--ink);
  border-right: 2px dashed var(--ink);
  border-radius: var(--radius-sm);
  padding: 2px var(--space-2);
  font-size: var(--text-sm);
  text-align: center;
  line-height: 1.35;
}
.spark { position: absolute; animation: sparkIn 220ms var(--ease-paper) both; }
.spark.s1 { left: 4%; top: 26%; }
.spark.s2 { right: 4%; top: 26%; }
.spark.s3 { left: 10%; bottom: 10%; }
.spark.s4 { right: 10%; bottom: 10%; }
@keyframes sparkIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }

/* ---------- Result / reward ---------- */
.reward-line { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-md); margin: var(--space-1) 0; }
.reward-mark {
  position: relative;
  display: inline-grid;
  place-items: center;
  width: 48px; height: 48px;
  flex: none;
  font-size: 15px;
  line-height: 1;
  isolation: isolate;
}
.reward-mark::before {
  content: "";
  position: absolute;
  width: 46px; height: 46px;
  border-radius: 50%;
  background: var(--yellow-soft);
  z-index: -1;
  animation: popIn 180ms var(--ease-paper) both;
}
@keyframes popIn { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- Plates (결산) ---------- */
.plates { display: flex; gap: var(--space-2); justify-content: center; flex-wrap: wrap; }
.plate-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.plate {
  width: 38px; height: 38px;
  border: var(--line);
  border-radius: 50%;
  background: var(--paper-strong);
  display: grid;
  place-items: center;
  font-size: var(--text-md);
}
.plate-day { font-size: var(--text-xs); color: var(--ink-soft); }
.stamp-note {
  display: inline-block;
  border: var(--line);
  border-radius: var(--radius-sm);
  padding: 4px var(--space-2);
  font-size: var(--text-sm);
  transform: rotate(-1.2deg);
  background: var(--paper-strong);
}
.ending-lines { font-size: var(--text-md); line-height: 1.7; }
.stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--line-faint);
  font-size: var(--text-md);
}
.stat-row:last-of-type { border-bottom: none; }
.stat-value { font-size: var(--text-lg); }

/* ---------- Overlay / modal ---------- */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: var(--space-4);
  background: rgba(39, 38, 33, .22);
}
.overlay::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(-45deg, transparent 0 5px, rgba(39, 38, 33, .08) 5px 7px);
}
.overlay-card {
  position: relative;
  width: 88%;
  max-width: 380px;
  max-height: 86%;
  overflow-y: auto;
  border: var(--line-heavy);
  border-radius: var(--radius-md);
  background: var(--paper-strong);
  padding: var(--space-4);
  text-align: center;
  animation: cardIn 220ms var(--ease-paper) both;
}
@keyframes cardIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
.overlay-close {
  position: absolute;
  top: var(--space-2); right: var(--space-2);
  width: 36px; height: 36px;
  border: var(--line);
  border-radius: var(--radius-round);
  background: var(--paper-strong);
  font: inherit;
  cursor: pointer;
  line-height: 1;
}
.overlay-close:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.event-icon {
  width: 120px;
  height: 120px;
  margin: 0 auto var(--space-2);
  display: grid;
  place-items: center;
  border: var(--line);
  border-radius: var(--radius-md);
  background: var(--paper);

.toast {
  position: absolute;
  left: 50%; top: 62px;
  transform: translateX(-50%);

  border: var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper-strong);
  padding: var(--space-1) var(--space-3);
  font-size: var(--text-sm);
  animation: toastIn 1.2s var(--ease-paper) forwards;
}
@keyframes toastIn { 0% { opacity: 0; } 12% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- 게임 방법 튜토리얼 ---------- */
.tutorial-scene {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  min-height: 0;
  margin-block: auto;
}
.tutorial-card {
  position: relative;
  border: var(--line);
  border-radius: var(--radius-md);
  background: var(--paper);
  padding: var(--space-2);
  overflow: hidden;
}
.tutorial-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 3;
  max-height: 60dvh;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tutorial-img {
  width: 100%;
  height: 100%;
  object-fit: contain;

.tutorial-fallback {

  color: var(--ink-soft);

.tutorial-frame.is-broken .tutorial-fallback { display: block; }
.tutorial-dots {

  justify-content: center;

}
.tutorial-dots .dot {

  border-radius: var(--radius-round);

}
.tutorial-dots .dot.is-on { background: var(--yellow); }
.tutorial-nav { display: flex; gap: var(--space-2); }
.tutorial-nav .btn { flex: 1; margin: 0; }

/* ---------- 엔딩 이미지 ---------- */
.ending-art {

  border-radius: var(--radius-md);
  background: var(--paper);
  padding: var(--space-2);
  margin-bottom: var(--space-3);
}
.ending-art-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  max-height: 30dvh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ending-art-frame img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
}
.ending-art-frame.is-broken img { display: none; }
.ending-art-fallback { display: none; text-align: center; font-size: var(--text-sm); color: var(--ink-soft); }
.ending-art-frame.is-broken .ending-art-fallback { display: block; }
.ending-collection { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
.ending-collection .chip-dim { opacity: .45; }

.ending-records-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.ending-records {
  flex: 1;
  min-height: 0;
  max-height: clamp(120px, 28dvh, 280px);
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--line-faint) transparent;
}
.ending-records::-webkit-scrollbar { width: 4px; }
.ending-records::-webkit-scrollbar-thumb { background: var(--line-faint); border-radius: 2px; }
.ending-records::-webkit-scrollbar-track { background: transparent; }
.records-fade {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 48px;
  background: linear-gradient(to bottom, transparent, var(--paper-strong));
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 4px;
  transition: opacity var(--duration-normal);
}
.records-fade.is-hidden { opacity: 0; pointer-events: none; }
.records-arrow {
  pointer-events: auto;
  width: 28px; height: 28px;
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
  animation: arrowBounce 1.6s ease-in-out infinite;
}
.records-arrow img { width: 100%; height: 100%; opacity: .55; }
@keyframes arrowBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(5px); }
}
@media (prefers-reduced-motion: reduce) {
  .records-arrow { animation: none; }
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 80ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 80ms !important;

  .msg, .seat, .overlay-card, .reward-mark::before, .spark, .tutorial-img {
    animation-name: fadeOnly !important;
  }
  @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }
  .seat { transform: translate(-50%, -50%); }
  .btn:hover:not([disabled]) { transform: none; }
  .timer.is-urgent .timer-number { animation: none; }
}
</style>

function clampHalf(v){ return Math.max(0, Math.min(5, Math.round(v * 2) / 2)); }
function rand(n){ return Math.floor(Math.random() * n); }
function pick(arr){ return arr[rand(arr.length)]; }
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = rand(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function fmtNum(v){ return Number.isInteger(v) ? String(v) : v.toFixed(1); }
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
function tagLabel(tag, wrap){
  if (!tag) return "";
  return `${TAG_ICON[tag] ? foodIcon(TAG_ICON[tag], wrap) : ""} ${esc(tag)}`;
}

let meterUid = 0;

function uiIcon(name, size){
  return `<span class="ui-icon ${name}${size ? " " + size : ""}" aria-hidden="true"></span>`;
}

function faceImg(key, cls){
  return `<img class="family-avatar${cls ? " " + cls : ""}" src="${AVATAR_SRC[key]}" alt="" aria-hidden="true">`;

function meterCell(kind, frac, size){
  const n = ++meterUid;
  const clipId = "mc" + n;
  const path = kind === "heart" ? HEART_PATH : STAR_PATH;
  return `<svg class="meter-cell${size ? " " + size : ""}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <defs><clipPath id="${clipId}"><rect x="0" y="0" width="${(24 * frac).toFixed(2)}" height="24"></rect></clipPath></defs>
    <path d="${path}" fill="#FFFFFF" stroke="#272621" stroke-width="2" stroke-linejoin="round"></path>
    <g clip-path="url(#${clipId})">
      <path d="${path}" fill="#F2DA55" stroke="#272621" stroke-width="2" stroke-linejoin="round"></path>
    </g>
  </svg>`;
}

function meterFive(kind, value, opts){
  const o = opts || {};
  const name = kind === "heart" ? "식탁 온기" : "나의 충전";
  let cells = "";
  for (let i = 0; i < 5; i++){
    cells += meterCell(kind, Math.max(0, Math.min(1, value - i)), o.size);
  }
  const num = o.hideNumber ? "" : `<span class="meter-num">${fmtNum(value)}/5</span>`;
  const maxCls = value >= 5 ? " is-max" : "";
  return `<span class="meter${maxCls}" role="img" aria-label="${name} 5점 중 ${fmtNum(value)}점">${cells}${num}</span>`;
}

function cellGauge(shortLabel, fullLabel, value){
  let cells = "";
  for (let i = 0; i < 5; i++){
    const frac = Math.max(0, Math.min(1, value - i));
    cells += `<span class="cell"><span class="cell-fill" style="width:${(frac * 100).toFixed(0)}%"></span></span>`;
  }
  return `<div class="hud-gauge">
    <span class="hud-gauge-label" aria-hidden="true">${shortLabel}</span>
    <span class="cell-meter" role="img" aria-label="${fullLabel} 5점 중 ${fmtNum(value)}점">${cells}</span>
  </div>`;
}

function speakerOf(text){
  const idx = text.indexOf(":");
  if (idx === -1) return null;
  const name = text.slice(0, idx);
  const map = { "엄마":"mom", "아빠":"dad", "동생":"sib", "나":"me" };
  return { name, key: map[name] || null, body: text.slice(idx + 1).trim() };
}

function messageNode(text, idx){
  const sp = speakerOf(text);
  if (!sp) return el("p", "msg-note", esc(text));
  const node = el("div", "msg" + (sp.key === "me" ? " from-me" : ""));
  const portrait = (sp.key && AVATAR_SRC[sp.key])
    ? `<span class="msg-face">${faceImg(sp.key)}</span>`
    : `<span class="msg-face">${uiIcon("phone", "lg")}</span>`;
  const time = showChatTime ? `<span class="msg-time">${chatTime(idx || 0)}</span>` : "";
  node.innerHTML = `${portrait}
    <div class="msg-body">
      <div class="msg-name">${esc(sp.name)}</div>
      <div class="msg-line">
        <div class="msg-strip">${esc(sp.body)}</div>
        ${time}
      </div>
    </div>`;
  return node;
}

let showChatTime = false;
function chatTime(i){
  const minutes = Math.floor(i / 2);
  return `오후 6:${String(minutes).padStart(2, "0")}`;
}

function playMessages(container, lines, onDone){
  let i = 0;
  let skipped = fastMode;
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    skipBtn.hidden = true;
    skipBtn.onclick = null;
    markLatest(container);
    if (onDone) onDone();
  };
  const flush = () => {
    container.innerHTML = "";
    lines.forEach((t, k) => container.appendChild(messageNode(t, k)));
    finish();
  };

  if (!lines.length){ finish(); return; }

  skipBtn.hidden = false;
  skipBtn.onclick = () => { skipped = true; flush(); };

  function step(){
    if (skipped){ flush(); return; }
    if (i >= lines.length){ finish(); return; }
    container.appendChild(messageNode(lines[i], i));
    container.parentElement && (container.parentElement.scrollTop = container.parentElement.scrollHeight);
    screenEl.scrollTop = screenEl.scrollHeight;
    i++;
    setTimeout(step, 620);
  }
  step();
}

function markLatest(container){

let tutorialPreloaded = false;
function preloadTutorial(){
  if (tutorialPreloaded) return;
  tutorialPreloaded = true;
  TUTORIAL_PAGES.forEach(p => { const im = new Image(); im.src = p.src; });
}

// onDone: 마지막 장 또는 건너뛰기 후에 실행할 동작
function renderTutorial(onDone){
  preloadTutorial();
  clearScreen();
  appEl.dataset.screen = "tutorial";

  let idx = 0;
  const scene = el("section", "scene tutorial-scene");
  const card = el("div", "tutorial-card");
  const frame = el("div", "tutorial-frame");
  frame.innerHTML = `<img class="tutorial-img" alt="">
    <p class="tutorial-fallback">이미지를 불러오지 못했어요.<br>버튼으로 계속 진행할 수 있어요.</p>`;
  const img = frame.querySelector(".tutorial-img");
  img.onerror = () => { frame.classList.add("is-broken"); };
  img.onload = () => { frame.classList.remove("is-broken"); };
  card.appendChild(frame);
  scene.appendChild(card);

  const dots = el("div", "tutorial-dots");
  dots.setAttribute("aria-hidden", "true");
  dots.innerHTML = TUTORIAL_PAGES.map(() => `<span class="dot"></span>`).join("");
  scene.appendChild(dots);
  screenEl.appendChild(scene);

  const nav = el("div", "action-area");
  const navRow = el("div", "tutorial-nav");
  const leftBtn = el("button", "btn ghost");
  const rightBtn = el("button", "btn primary");
  leftBtn.type = rightBtn.type = "button";
  navRow.appendChild(leftBtn);
  navRow.appendChild(rightBtn);
  nav.appendChild(navRow);
  screenEl.appendChild(nav);

  function finish(){
    meta.tutorialSeen = true;
    saveMeta();
    onDone();
  }
  function go(next){
    if (next < 0 || next >= TUTORIAL_PAGES.length) return;
    idx = next;
    draw();
  }
  function draw(){
    const page = TUTORIAL_PAGES[idx];
    frame.classList.remove("is-broken");
    // 같은 노드를 다시 그려 전환 애니메이션을 재생한다.
    img.classList.remove("tutorial-img");
    void img.offsetWidth;
    img.classList.add("tutorial-img");
    img.src = page.src;
    img.alt = page.alt;
    Array.from(dots.children).forEach((d, i) => d.classList.toggle("is-on", i === idx));

    leftBtn.textContent = idx === 0 ? "건너뛰기" : "이전";
    leftBtn.onclick = idx === 0 ? finish : () => go(idx - 1);
    const last = idx === TUTORIAL_PAGES.length - 1;
    rightBtn.textContent = last ? "게임 시작" : "다음";
    rightBtn.onclick = last ? finish : () => go(idx + 1);
    primaryActionBtn = rightBtn;
    announce(`게임 방법 ${idx + 1} / ${TUTORIAL_PAGES.length}`);
  }
  draw();

  // 모바일 좌우 스와이프
  let touchX = null;
  card.addEventListener("touchstart", e => { touchX = e.changedTouches[0].clientX; }, { passive:true });
  card.addEventListener("touchend", e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) < 40) return;
    go(dx < 0 ? idx + 1 : idx - 1);
  }, { passive:true });
}

let prefStep = 0;
let prefTemp = { liked:[], disliked:null, restricted:null };

function renderPrefs(){
  clearScreen();
  appEl.dataset.screen = "setup";

  const head = el("section", "panel plain");
  head.innerHTML = `
    <h2 class="screen-title">나는 이런 저녁이 좋아요</h2>
    <p class="step-count">준비 1/3 · 음식 취향</p>
  `;
  screenEl.appendChild(head);

  const prompt = el("p", "body-text");
  screenEl.appendChild(prompt);

  const grid = el("div", "card-grid");
  screenEl.appendChild(grid);

  const actions = el("div", "action-area");
  const nextBtn = el("button", "btn primary", "다음");
  nextBtn.type = "button";
  const backBtn = el("button", "btn ghost", "이전 선택 고치기");
  backBtn.type = "button";
  actions.appendChild(nextBtn);
  actions.appendChild(backBtn);
  screenEl.appendChild(actions);
  primaryActionBtn = nextBtn;

  function card(label, selected, disabled, onClick){
    const b = el("button", "choice-card" + (selected ? " is-selected" : ""));
    b.type = "button";
    b.disabled = !!disabled;
    b.setAttribute("aria-pressed", selected ? "true" : "false");
    b.innerHTML = `<span class="scribble" aria-hidden="true"></span>
      <span class="label">${label}</span>
      ${selected ? '<span class="check" aria-hidden="true">✓</span>' : ""}`;
    b.onclick = onClick;
    if (disabled) b.style.opacity = ".45";
    return b;
  }

  function draw(){
    grid.innerHTML = "";
    if (prefStep === 0){
      prompt.textContent = "좋아하는 음식군 2개를 골라주세요.";
      FOOD_TAGS.forEach(tag => {
        const sel = prefTemp.liked.includes(tag);
        grid.appendChild(card(tagLabel(tag, true), sel, false, () => {
          if (sel) prefTemp.liked = prefTemp.liked.filter(t => t !== tag);
          else if (prefTemp.liked.length < 2) prefTemp.liked.push(tag);
          draw();
        }));
      });
      nextBtn.disabled = prefTemp.liked.length !== 2;
      backBtn.hidden = true;
    } else if (prefStep === 1){
      prompt.textContent = "별로 반갑지 않은 음식군 1개를 골라주세요.";
      FOOD_TAGS.forEach(tag => {
        const isLiked = prefTemp.liked.includes(tag);
        const sel = prefTemp.disliked === tag;
        grid.appendChild(card(tagLabel(tag, true), sel, isLiked, () => {
          prefTemp.disliked = tag;
          draw();
        }));
      });
      nextBtn.disabled = !prefTemp.disliked;
      backBtn.hidden = false;
    } else {
      prompt.textContent = "못 먹는 재료 1개를 골라주세요. 취향이 아니라 식사 제한이에요.";
      RESTRICT_INGS.forEach(ing => {
        const sel = prefTemp.restricted === ing;
        grid.appendChild(card(`${foodIcon(RESTRICT_ICON[ing] || WARNING_ICON, true)} ${esc(ing)}`, sel, false, () => {
          prefTemp.restricted = ing;
          draw();
        }));
      });
      nextBtn.disabled = !prefTemp.restricted;
      backBtn.hidden = false;
    }
    nextBtn.textContent = prefStep < 2 ? "다음" : "일정 정하러 가기";
  }

  nextBtn.onclick = () => {
    if (nextBtn.disabled) return;
    if (prefStep < 2){ prefStep++; draw(); return; }
    state.preferences.likedTags = prefTemp.liked.slice();
    state.preferences.dislikedTag = prefTemp.disliked;
    state.preferences.restrictedIngredient = prefTemp.restricted;
    state.phase = "schedule";
    save();
    route();
  };
  backBtn.onclick = () => { if (prefStep > 0){ prefStep--; draw(); } };

  draw();
}

let schedTemp = [];
let pendingType = null;
let schedImportantChosen = false;

function schedHelperMsg(){
  if (schedTemp.length === 0 && !pendingType) return "먼저 일정 종류를 골라주세요.";
  if (pendingType && schedTemp.length < 3) return "좋아요! 이제 날짜를 눌러주세요.";
  if (schedTemp.length === 1) return "일정이 추가됐어요. 2개 남았어요.";
  if (schedTemp.length === 2) return "좋아요! 일정이 1개 남았어요.";
  if (schedTemp.length === 3 && !schedImportantChosen) return "가장 중요한 일정 하나를 골라주세요.";
  if (schedImportantChosen) return "이번 주 일정이 준비됐어요!";
  return "";
}

function renderSchedule(){
  clearScreen();
  appEl.dataset.screen = "setup";

  const head = el("section", "panel plain");
  head.innerHTML = `
    <h2 class="screen-title">이번 주 내 일정</h2>
    <p class="body-text">이번 주에 하고 싶은 일을 골라<br>일정 3개를 만들어보세요.</p>
    <p class="step-count">일정 <span class="hud-number">${schedTemp.length} / 3</span></p>
  `;
  screenEl.appendChild(head);

  // ① 일정 종류
  const step1 = el("section", "panel");
  step1.innerHTML = `<p class="body-text"><strong>① 무엇을 할까요?</strong></p>
    <p class="sub-text">일정 종류를 하나 골라주세요.</p>`;
  const chips = el("div", "chip-row");
  SCHEDULE_TYPES.forEach(t => {
    const c = el("button", "chip" + (pendingType === t.id ? " is-selected" : ""),
      `${foodIcon(t.icon)} ${esc(t.label)}`);
    c.type = "button";
    c.disabled = schedTemp.length >= 3;
    c.setAttribute("aria-pressed", pendingType === t.id ? "true" : "false");
    c.onclick = () => { pendingType = (pendingType === t.id) ? null : t.id; renderSchedule(); };
    chips.appendChild(c);
  });
  step1.appendChild(chips);
  screenEl.appendChild(step1);

  // ② 날짜
  const step2 = el("section", "panel");
  step2.innerHTML = `<p class="body-text"><strong>② 언제 할까요?</strong></p>
    <p class="sub-text">선택한 일정을 넣을 날짜를 눌러주세요.</p>`;
  const rail = el("div", "day-rail");
  DAY_NAMES.forEach((d, di) => {
    const slot = schedTemp.find(s => s.day === di);
    const card = el("button", "day-card" + (slot ? " is-filled" : ""));
    card.type = "button";
    const type = slot ? SCHEDULE_TYPES.find(t => t.id === slot.type) : null;
    card.innerHTML = `
      <span class="day-name">${d}</span>
      ${slot
        ? `${foodIcon(type.icon)}
           <span class="day-slot">${esc(type.label)}</span>
           ${slot.isImportant ? uiIcon("star", "sm") : ""}`
        : `<span class="day-slot" aria-hidden="true">—</span>`}
    `;
    card.setAttribute("aria-label", slot
      ? `${d}요일 ${type.label} 일정${slot.isImportant ? ", 중요한 일정" : ""}`
      : `${d}요일 비어 있음`);
    card.onclick = () => {
      if (slot) return;
      if (!pendingType){ announce("먼저 일정 종류를 골라주세요."); return; }
      if (schedTemp.length >= 3) return;
      schedTemp.push({ day: di, type: pendingType, isImportant: false, status:"예정" });
      pendingType = null;
      schedImportantChosen = false;
      renderSchedule();
    };
    if (slot){
      const rm = el("button", "day-remove", "×");
      rm.type = "button";
      rm.setAttribute("aria-label", `${d}요일 일정 삭제`);
      rm.onclick = (ev) => {
        ev.stopPropagation();
        const wasImportant = slot.isImportant;
        schedTemp = schedTemp.filter(s => s.day !== di);
        if (wasImportant) schedImportantChosen = false;
        renderSchedule();
      };
      card.appendChild(rm);
    }
    rail.appendChild(card);
  });
  step2.appendChild(rail);
  screenEl.appendChild(step2);

  // 등록된 일정 요약
  if (schedTemp.length){
    const list = el("section", "panel");
    list.innerHTML = schedTemp.slice().sort((a, b) => a.day - b.day).map(s => {
      const t = SCHEDULE_TYPES.find(x => x.id === s.type);
      return `<p class="body-text">${DAY_NAMES[s.day]}요일 · ${esc(t.label)} ${s.isImportant ? uiIcon("star", "sm") + " 중요" : ""}</p>`;
    }).join("");
    screenEl.appendChild(list);
  }

  // ③ 중요한 일정 (3개 완성 후에만)
  if (schedTemp.length === 3){
    const step3 = el("section", "panel");
    step3.innerHTML = `<p class="body-text"><strong>③ 가장 중요한 일정은 무엇인가요?</strong></p>
      <p class="sub-text">세 일정 중 꼭 지키고 싶은 일정 하나를 골라주세요.<br>중요한 일정은 지켰을 때 나의 충전을 더 많이 얻어요.</p>`;
    const starRow = el("div", "chip-row");
    schedTemp.slice().sort((a, b) => a.day - b.day).forEach(s => {
      const t = SCHEDULE_TYPES.find(x => x.id === s.type);
      const c = el("button", "chip" + (s.isImportant ? " is-selected" : ""),
        `${DAY_NAMES[s.day]} · ${esc(t.label)}`);
      c.type = "button";
      c.onclick = () => {
        schedTemp.forEach(x => { x.isImportant = false; });
        s.isImportant = true;
        schedImportantChosen = true;
        renderSchedule();
      };
      starRow.appendChild(c);
    });
    step3.appendChild(starRow);
    screenEl.appendChild(step3);
  }

  // 보조 문구
  const helper = el("p", "sub-text center", schedHelperMsg());
  helper.style.marginTop = "var(--space-2)";
  screenEl.appendChild(helper);

  const actions = el("div", "action-area");
  const next = el("button", "btn primary", "이번 주 메뉴 보기");
  next.type = "button";
  next.disabled = schedTemp.length !== 3 || !schedImportantChosen;
  next.onclick = () => {
    if (next.disabled) return;
    state.schedules = schedTemp.map(s => ({
      day: s.day, type: s.type,
      importance: s.isImportant ? "important" : "normal",
      status: "예정"
    }));
    buildWeek();
    state.phase = "menuPreview";
    save();
    route();
  };
  actions.appendChild(next);
  screenEl.appendChild(actions);
  primaryActionBtn = next;
}

// ===================== 주간 생성 =====================

function buildWeek(){
  const pool = shuffle(MENUS);
  const menus = [];
  for (let i = 0; i < 7; i++) menus.push(pool[i % pool.length]);
  menus[6] = SUNDAY_SPECIAL;

  const changeDays = shuffle([0,1,2,3,4,5]).slice(0, 2);
  state.weeklyMenus = menus.map((m, i) => ({ menu:m, changed: changeDays.includes(i), changeEvent:null, actualMenu:null }));

  state.weeklyCook = { cook:"mom", day:null };
  if (Math.random() < 0.4) state.weeklyCook = { cook:"dad", day: rand(6) };

  state.weeklyInterruption = { enabled:false, day:null, eventId:null, triggered:false };
  if (meta.interruptionUnlocked && Math.random() < 0.3){
    const unseen = INTERRUPTION_EVENTS.filter(e => !meta.seenInterruptionIds.includes(e.id));
    const ev = pick(unseen.length ? unseen : INTERRUPTION_EVENTS);
    state.weeklyInterruption = { enabled:true, day: rand(7), eventId: ev.id, triggered:false };
  }

  state.weeklyFamilyOuting = { enabled:false, day:null, outingId:null, triggered:false };
  const weekIndex = meta.completedWeeks + 1;
  if (meta.familyOutingUnlocked){
    let doOuting = false;
    if (weekIndex === 8 && !meta.familyOutingSeen) doOuting = true;
    else if (weekIndex >= 9) doOuting = Math.random() < 0.35;
    if (doOuting){
      const candidates = [5, 6].filter(d => d !== state.weeklyInterruption.day);
      const day = candidates.length ? pick(candidates) : (state.weeklyInterruption.day === 6 ? 5 : 6);
      const unseen = OUTING_PLACES.filter(p => !meta.seenOutingIds.includes(p));
      state.weeklyFamilyOuting = { enabled:true, day, outingId: pick(unseen.length ? unseen : OUTING_PLACES), triggered:false };
      if (state.weeklyCook.cook === "dad" && state.weeklyCook.day === day){
        const alt = [0,1,2,3,4].filter(x => x !== day);
        if (alt.length) state.weeklyCook.day = pick(alt);
        else state.weeklyCook = { cook:"mom", day:null };
      }
    }
  }
}

// ===================== 하루 계산 헬퍼 =====================

function todaySchedule(){
  return state.schedules.find(s => s.day === state.currentDay && s.status === "예정");
}
function cookOfDay(day){
  return (state.weeklyCook.cook === "dad" && state.weeklyCook.day === day) ? "dad" : "mom";
}
function isOutingDay(day){
  return state.weeklyFamilyOuting.enabled && state.weeklyFamilyOuting.day === day;
}

function computeAbsentees(){
  const day = state.currentDay;
  if (state.dayAbsenteesComputedDay === day) return state.dayAbsentees;

  let absentees;
  if (isOutingDay(day)){
    absentees = [];
  } else if (cookOfDay(day) === "dad"){
    absentees = shuffle(["mom","sib"]).slice(0, Math.random() < 0.6 ? 0 : 1);
  } else {
    const twoUsed = state.eventHistory.filter(e => e.type === "twoAbsent").length;
    const roll = Math.random();
    let count;
    if (twoUsed >= 2) count = roll < 0.5 ? 0 : 1;
    else count = roll < 0.35 ? 0 : (roll < 0.75 ? 1 : 2);
    absentees = shuffle(["mom","dad","sib"]).slice(0, count);
    if (count === 2) state.eventHistory.push({ type:"twoAbsent", day });
  }

  state.dayAbsentees = absentees;
  state.dayAbsenteesComputedDay = day;
  return absentees;
}

function resolveMenu(wm){
  const day = state.currentDay;
  if (isOutingDay(day)){
    return { name: state.weeklyFamilyOuting.outingId, tags:["고기"], ings:[], outing:true };
  }
  if (wm.actualMenu) return wm.actualMenu;
  if (!wm.changed) return wm.menu;
  const ev = pick(CHANGE_EVENTS);
  wm.changeEvent = ev;
  if (ev.type === "delivery") return DELIVERY_MENU;
  if (ev.type === "substitute"){
    return { ...wm.menu, ings: wm.menu.ings.filter(i => i !== state.preferences.restrictedIngredient), name: wm.menu.name + " (재료 대체)" };
  }
  return pick(MENUS.filter(m => m.name !== wm.menu.name));
}

function startAnswerPhase(chatPanel, chat, timerWrap, actions, absentees, actualMenu, cook){
  const sch = todaySchedule();
  const restricted = state.preferences.restrictedIngredient;
  const hasRestricted = (actualMenu.ings || []).includes(restricted);

  const options = [];
  options.push({ key:"eat", label: hasRestricted ? "저도 먹을게요. 그 재료는 빼주세요!" : "저 먹어요!" });
  if (sch) options.push({ key:"schedule", label:"나 오늘 약속 있어." });
  options.push({ key:"late", label:"조금 늦게 먹을게." });

  timerWrap.innerHTML = `
    <div class="answer-panel">
      <div class="timer" id="timerBox">
        ${uiIcon("clock", "lg")}
        <span class="timer-main">
          <span class="timer-label">${TIMER_SECONDS}초 안에 답장하기</span>
          <span class="timer-cells" id="timerCells" aria-hidden="true">
            ${"<span class=\"timer-cell\"></span>".repeat(TIMER_SECONDS)}
          </span>
        </span>
        <span class="timer-sep" aria-hidden="true"></span>
        <span class="timer-number" id="timerNum">${TIMER_SECONDS}</span>
      </div>
      <div class="choice-list" id="choiceList"></div>
    </div>`;
  const timerBox = document.getElementById("timerBox");
  const cells = Array.from(document.getElementById("timerCells").children);
  const numEl = document.getElementById("timerNum");

  let answered = false;
  const buttons = [];

  const choiceList = document.getElementById("choiceList");
  options.forEach((opt, i) => {
    const b = el("button", "btn choice-btn",
      `<span class="choice-num" aria-hidden="true">${i + 1}</span><span>${esc(opt.label)}</span>`);
    b.type = "button";
    b.setAttribute("aria-keyshortcuts", String(i + 1));
    b.onclick = () => choose(opt.key, b);
    choiceList.appendChild(b);
    buttons.push(b);
  });
  activeKeyChoices = buttons;

  const startAt = Date.now();
  announce("5초 안에 답장하세요.");
  let urgentAnnounced = false;

  timerHandle = setInterval(() => {
    const elapsed = (Date.now() - startAt) / 1000;
    const left = Math.max(0, TIMER_SECONDS - elapsed);
    const leftCeil = Math.ceil(left);
    numEl.textContent = String(leftCeil);
    cells.forEach((c, idx) => c.classList.toggle("is-empty", idx >= leftCeil));
    if (leftCeil <= 2 && !urgentAnnounced){
      urgentAnnounced = true;
      timerBox.classList.add("is-urgent");
      announce("2초 남았습니다.");
    }
    if (left <= 0){
      stopTimer();
      if (!answered) choose("timeout", null);
    }
  }, 100);

  function stopTimer(){
    if (timerHandle){ clearInterval(timerHandle); timerHandle = null; }
  }

  function choose(key, btn){
    if (answered) return;
    answered = true;
    stopTimer();
    activeKeyChoices = [];
    buttons.forEach(b => { b.disabled = true; });
    if (btn) btn.classList.add("is-selected");
    timerBox.classList.remove("is-urgent");
    timerBox.remove();

    if (key !== "timeout"){
      const sending = el("p", "msg-note", '보내는 중 <span class="ink-dots"><i></i><i></i><i></i></span>');
      chat.appendChild(sending);
      const label = options.find(o => o.key === key).label;
      setTimeout(() => {
        sending.remove();
        chat.appendChild(messageNode(`나: ${label}`, chat.querySelectorAll(".msg").length));
        markLatest(chat);
        proceed(key);
      }, fastMode ? 60 : 420);
    } else {
      proceed(key);
    }
  }

  function proceed(key){
    const elapsed = (Date.now() - startAt) / 1000;
    if (key !== "timeout" && elapsed <= 2) state.fastAnswerCount++;

    const itr = state.weeklyInterruption;
    if (itr.enabled && itr.day === state.currentDay && !itr.triggered){
      itr.triggered = true;
      const ev = INTERRUPTION_EVENTS.find(e => e.id === itr.eventId);
      if (!meta.seenInterruptionIds.includes(ev.id)){
        meta.seenInterruptionIds.push(ev.id);
        saveMeta();
      }
      showInterruption(ev, () => finishDay(key, absentees, actualMenu, sch, hasRestricted));
      return;
    }
    finishDay(key, absentees, actualMenu, sch, hasRestricted);
  }
}

function showInterruption(ev, onDone){
  const face = uiIcon("phone", "xl");
  const body = `
    <div class="event-icon" role="img" aria-label="${esc(ev.title)}">${face}</div>
    <h2 class="screen-title">${esc(ev.title)}</h2>
    <p class="msg-note">메시지를 전송하는 중 <span class="ink-dots"><i></i><i></i><i></i></span></p>
  `;
  const card = showOverlay(body, { closable:false });

  setTimeout(() => {
    card.innerHTML = `
      <div class="event-icon" role="img" aria-label="${esc(ev.title)}">${face}</div>
      <h2 class="screen-title">${esc(ev.title)}</h2>
      <div class="chat" style="text-align:left">

      </div>
      <p class="sub-text" style="margin-top:var(--space-3)">선택 결과는 그대로 적용됩니다.</p>

    btn.style.marginTop = "var(--space-3)";
    btn.onclick = () => { closeOverlay(); onDone(); };
    card.appendChild(btn);

  }, fastMode ? 120 : 1400);
}

function finishDay(key, absentees, actualMenu, sch, hasRestricted){
  const before = { warmth: state.tableWarmth, recharge: state.personalRecharge };
  const rewards = [];
  const notes = [];
  const seats = { mom:"empty", dad:"empty", sib:"empty", me:"empty" };
  const outing = !!actualMenu.outing;

  ["mom","dad","sib"].forEach(m => { if (!absentees.includes(m)) seats[m] = "together"; });
  if (outing){ seats.mom = seats.dad = seats.sib = "together"; state.weeklyFamilyOuting.triggered = true; }

  let ateMeal = false;
  let lateJoin = false;

  if (key === "timeout"){
    state.timeoutCount++;
    notes.push("답장을 놓쳤어요.");
    notes.push(pick(TIMEOUT_LINES));
    if (sch){
      sch.status = "참석";
      state.personalRecharge = clampHalf(state.personalRecharge + 0.5);
      rewards.push({ kind:"star", text:"나의 충전 +0.5" });
    }
  } else if (key === "eat"){
    ateMeal = true;
    seats.me = "together";
    state.tableWarmth = clampHalf(state.tableWarmth + 0.5);
    rewards.push({ kind:"heart", text:"식탁 온기 +0.5" });
    if (hasRestricted){
      state.restrictedCareCount++;
      notes.push(outing ? "먹을 수 있는 메뉴로 같이 골랐어요." : "못 먹는 재료는 빼고 차려졌어요.");
    } else if (actualMenu.tags.some(t => state.preferences.likedTags.includes(t))){
      state.personalRecharge = clampHalf(state.personalRecharge + 0.5);
      state.likedMealCount++;
      rewards.push({ kind:"star", text:"좋아하는 메뉴라 나의 충전 +0.5" });
    }
    if (sch){
      sch.status = "취소";
      state.tableWarmth = clampHalf(state.tableWarmth + 0.5);
      rewards.push({ kind:"heart", text:"일정을 미루고 함께해서 식탁 온기 +0.5" });
    }
  } else if (key === "schedule"){
    sch.status = "참석";
    const gain = IMPORTANCE[sch.importance].recharge;
    state.personalRecharge = clampHalf(state.personalRecharge + gain);
    rewards.push({ kind:"star", text:`나의 충전 +${fmtNum(gain)}` });
    notes.push("오늘은 내 일정을 지켰어요.");
  } else if (key === "late"){
    ateMeal = true;
    lateJoin = true;
    seats.me = "late";
    state.tableWarmth = clampHalf(state.tableWarmth + 0.5);
    rewards.push({ kind:"heart", text:"식탁 온기 +0.5" });
    if (sch){
      sch.status = "지각 참석";
      state.personalRecharge = clampHalf(state.personalRecharge + 0.5);
      rewards.push({ kind:"star", text:"일정에도 들러서 나의 충전 +0.5" });
    }
  }

  if (ateMeal){
    state.mealCount++;
    if (lateJoin) state.lateJoinCount++;
    if (outing) state.outingJoined = true;
    if (cookOfDay(state.currentDay) === "dad") state.dadMealCount++;
    const allTogether = !lateJoin && seats.mom === "together" && seats.dad === "together" && seats.sib === "together";
    if (allTogether){
      state.fullFamilyMealCount++;
      state.tableWarmth = clampHalf(state.tableWarmth + 0.5);
      rewards.push({ kind:"heart", text:"넷이서 한 끼! 식탁 온기 +0.5" });
    }
  }

  const seatCount = ["mom","dad","sib","me"].filter(k => seats[k] !== "empty").length;
  state.choices.push({ day: state.currentDay, choice: key });
  state.dayLog[state.currentDay] = seats.me;
  state.dayResult = {
    seats,
    rewards,
    notes,
    outing,
    menuName: outing ? state.weeklyFamilyOuting.outingId : actualMenu.name,
    menuTag: outing ? null : (actualMenu.tags && actualMenu.tags[0]) || null,
    seatCount,
    before
  };
  state.phase = "result";
  save();
  route();
}

function applyGoalBonus(){
  if (!state.goalBonusApplied && state.mealCount >= 3){
    state.tableWarmth = clampHalf(state.tableWarmth + 0.5);
    state.goalBonusApplied = true;
  }
}

// 엔딩 판정에 쓰이는 값만 한 곳에 모은다. ENDING_DEFS의 test(c)가 이 객체를 받는다.
function endingContext(warmth, recharge, attended){
  const replyTotal = state.choices.length;
  const missed = state.choices.filter(c => c.choice === "timeout").length;
  const answered = replyTotal - missed;
  return {
    warmth,
    recharge,
    meals: state.mealCount,
    fullFamilyMeals: state.fullFamilyMealCount,
    lateJoins: state.lateJoinCount,
    likedMeals: state.likedMealCount,
    restrictedCare: state.restrictedCareCount || 0,
    dadMeals: state.dadMealCount || 0,
    dadCooked: state.weeklyCook.cook === "dad" && state.weeklyCook.day !== null,
    outingHappened: !!state.weeklyFamilyOuting.triggered,
    outingJoined: !!state.outingJoined,
    attended,
    replyTotal,
    answered,
    missed,
    replyRate: replyTotal ? answered / replyTotal : 0,
    weekIndex: meta.completedWeeks + 1
  };
}

function computeEnding(){
  applyGoalBonus();
  const w = state.tableWarmth;
  const r = state.personalRecharge;
  const cancelled = state.schedules.filter(s => s.status === "취소").length;
  const attended = state.schedules.filter(s => s.status === "참석" || s.status === "지각 참석").length;

  const ctx = endingContext(w, r, attended);
  const ending = ENDING_DEFS.find(e => {
    try { return e.test(ctx); } catch(err){ return false; }
  }) || ENDING_DEFS[ENDING_DEFS.length - 1];

  const patterns = [];
  if (state.fullFamilyMealCount >= 1) patterns.push("넷이서 한 끼");
  if (state.lateJoinCount >= 2) patterns.push("늘 조금 늦게 도착한 자리");
  if (state.likedMealCount >= 2) patterns.push("좋아하는 냄새를 따라온 한 주");
  if (cancelled === 0 && attended >= 2) patterns.push("일정을 잘 지킨 한 주");
  if (state.fastAnswerCount >= 4) patterns.push("이번 주의 빠른 답장왕");
  if (state.mealCount >= 3) patterns.push("이번 주의 식사 목표 완료");

  const PATTERN_EXCLUDE = {
    "missed-week": ["일정을 잘 지킨 한 주", "이번 주의 식사 목표 완료", "넷이서 한 끼"],
    "my-week": ["이번 주의 식사 목표 완료", "넷이서 한 끼"],
    "waiting-table": ["이번 주의 식사 목표 완료", "넷이서 한 끼"]
  };
  const exclude = PATTERN_EXCLUDE[ending.id] || [];
  const filtered = patterns.filter(p => !exclude.includes(p));

  return {
    ending,
    headline: ending.headline,
    pattern: filtered.length ? filtered[0] : "조용히 지나간 한 주",
    cancelled,
    attended,
    replyRate: ctx.replyRate,
    answered: ctx.answered,
    replyTotal: ctx.replyTotal,
    outingNote: state.weeklyFamilyOuting.triggered && !meta.familyOutingSeen ? "오랜만의 가족 외식" : null
  };
}

function renderEnding(){
  clearScreen();
  appEl.dataset.screen = "ending";

  const result = state.endingResult || computeEnding();
  state.endingResult = result;
  state.endingId = result.ending.id;

  if (!state.endingRecorded){
    state.endingRecorded = true;
    meta.completedWeeks++;
    if (meta.completedWeeks >= 3) meta.interruptionUnlocked = true;
    if (meta.completedWeeks >= 7) meta.familyOutingUnlocked = true;
    if (state.weeklyFamilyOuting.triggered){
      meta.familyOutingSeen = true;
      const place = state.weeklyFamilyOuting.outingId;
      if (place && !meta.seenOutingIds.includes(place)) meta.seenOutingIds.push(place);
    }
    recordEnding(result.ending.id);
    saveMeta();
    save();
  }

  const art = el("section", "ending-art");
  art.innerHTML = `
    <div class="ending-art-frame">
      <img src="${result.ending.image}" alt="엔딩 — ${esc(result.ending.title)}">
      <p class="ending-art-fallback">${esc(result.ending.title)}<br>${esc(result.headline)}</p>
    </div>`;
  const artFrame = art.querySelector(".ending-art-frame");
  art.querySelector("img").onerror = () => artFrame.classList.add("is-broken");
  screenEl.appendChild(art);

  const head = el("section", "panel plain");
  let warmthCells = "";
  for (let i = 0; i < 5; i++){
    warmthCells += meterCell("heart", Math.max(0, Math.min(1, state.tableWarmth - i)), "lg");
  }
  head.innerHTML = `
    <h1 class="sr-only" id="endTitle" tabindex="-1">${esc(result.ending.title)} — ${esc(result.headline)}</h1>
    <div class="center" style="margin:var(--space-2) 0">
      <span class="meter" style="gap:var(--space-1)" role="img"
        aria-label="식탁 온기 5점 중 ${fmtNum(state.tableWarmth)}점">${warmthCells}</span>
    </div>
  `;
  screenEl.appendChild(head);

  const recordsWrap = el("div", "ending-records-wrap");
  const records = el("div", "ending-records");

  const plates = el("section", "plates");
  plates.innerHTML = DAY_NAMES.map((d, i) => {
    const st = state.dayLog[i];
    const mark = st === "together" ? "●" : (st === "late" ? "◐" : "○");
    const label = st === "together" ? "함께 먹음" : (st === "late" ? "늦게 합류" : "불참");
    return `<div class="plate-col">
      <div class="plate" role="img" aria-label="${d}요일 ${label}">${mark}</div>
      <span class="plate-day">${d}</span>
    </div>`;
  }).join("");
  records.appendChild(plates);

  const meters = el("section", "panel");
  meters.innerHTML = `
    <div class="stat-row"><span class="stat-name">가족과 함께 먹은 횟수</span><span class="stat-value hud-number">${state.mealCount}회</span></div>
    <div class="stat-row"><span class="stat-name">지킨 개인 일정</span><span class="stat-value hud-number">${result.attended}개</span></div>
    <div class="stat-row"><span class="stat-name">답장 성공률</span><span class="stat-value hud-number">${Math.round((result.replyRate || 0) * 100)}%</span></div>
    <div class="stat-row"><span class="stat-name">최종 가족 온기</span><span class="stat-value hud-number">${fmtNum(state.tableWarmth)}/5</span></div>
    <div class="stat-row"><span class="stat-name">획득한 엔딩</span><span class="stat-value">${esc(result.ending.title)}</span></div>
    <p class="sub-text" style="margin-top:var(--space-3)">
      나의 충전 <span class="hud-number">${fmtNum(state.personalRecharge)}</span> ·
      넷이서 <span class="hud-number">${state.fullFamilyMealCount}회</span> ·
      늦게 합류 <span class="hud-number">${state.lateJoinCount}회</span> ·
      미룬 일정 <span class="hud-number">${result.cancelled}개</span>
    </p>
  `;
  records.appendChild(meters);

  const story = el("section", "panel plain");
  story.innerHTML = `
    <p class="ending-lines">${result.ending.lines.map(esc).join("<br>")}</p>
    <p class="center" style="margin-top:var(--space-3)"><span class="stamp-note">${esc(result.pattern)}</span></p>
    ${result.outingNote ? `<p class="center" style="margin-top:var(--space-2)"><span class="stamp-note">${esc(result.outingNote)}</span></p>` : ""}
  `;
  records.appendChild(story);

  recordsWrap.appendChild(records);

  const fade = el("div", "records-fade");
  const arrow = el("button", "records-arrow");
  arrow.type = "button";
  arrow.setAttribute("aria-label", "기록 더 보기");
  arrow.innerHTML = `<img src="assets/thanksmeal/tutorial-icons-v1/gameplay/down-arrow.png" alt="">`;
  arrow.onclick = () => { records.scrollBy({ top: 100, behavior: "smooth" }); };
  fade.appendChild(arrow);
  recordsWrap.appendChild(fade);

  function updateFade(){
    const atBottom = records.scrollHeight - records.scrollTop - records.clientHeight < 8;
    const noScroll = records.scrollHeight <= records.clientHeight + 2;
    fade.classList.toggle("is-hidden", atBottom || noScroll);
  }
  records.addEventListener("scroll", updateFade);
  requestAnimationFrame(updateFade);

  screenEl.appendChild(recordsWrap);

  function resetWeek(){
    clearSave();
    fastMode = false;
    prefStep = 0;
    prefTemp = { liked:[], disliked:null, restricted:null };
    schedTemp = [];
    pendingType = null;
    state = freshState();
  }

  const actions = el("div", "action-area");
  const again = el("button", "btn primary", "다시 한 주 보내기");
  again.type = "button";
  again.onclick = () => {
    resetWeek();
    state.phase = "prefs";
    route();
  };
  actions.appendChild(again);

  const home = el("button", "btn ghost", "처음으로");
  home.type = "button";
  home.onclick = () => { resetWeek(); route(); };
  actions.appendChild(home);

  const album = el("button", "btn ghost", "모은 엔딩 보기");
  album.type = "button";
  album.onclick = openEndingAlbum;
  actions.appendChild(album);

  screenEl.appendChild(actions);
  primaryActionBtn = again;

  document.getElementById("endTitle").focus();
}

// ===================== 오버레이 =====================

function showOverlay(html, opts){
  closeOverlay();
  const o = opts || {};
  const layer = el("div", "overlay");
  layer.id = "overlayLayer";
  const card = el("div", "overlay-card", html);
  layer.appendChild(card);
  if (o.closable){
    const close = el("button", "overlay-close", "×");
    close.type = "button";
    close.setAttribute("aria-label", "닫기");
    close.onclick = closeOverlay;
    card.appendChild(close);
    overlayCloser = closeOverlay;
    setTimeout(() => close.focus(), 0);
  } else {
    overlayCloser = null;
  }
  appEl.appendChild(layer);
  return card;
}
function closeOverlay(){
  const layer = document.getElementById("overlayLayer");
  if (layer) layer.remove();
  overlayCloser = null;
}

// ===================== 라우터 =====================

function migrate(s){
  if (!s) return freshState();
  const fresh = freshState();
  const merged = Object.assign(fresh, s);
  if (merged.phase === "morning" || merged.phase === "noon") merged.phase = "day";
  if (merged.phase === "summary") merged.phase = "ending";
  if (merged.phase === "intro") merged.phase = "prefs";
  if (!Array.isArray(merged.dayLog)) merged.dayLog = [];
  return merged;
}

function route(){
  if (timerHandle){ clearInterval(timerHandle); timerHandle = null; }
  closeOverlay();
  skipBtn.hidden = true;
  showChatTime = false;
  renderHud();

  if (!state){ renderTitle(); return; }
  switch (state.phase){
    case "title": renderTitle(); break;
    case "prefs": renderPrefs(); break;
    case "schedule": renderSchedule(); break;
    case "menuPreview": renderMenuPreview(); break;
    case "day": renderDay(); break;
    case "chat": renderChat(); break;
    case "result": renderResult(); break;
    case "ending": renderEnding(); break;
    default: renderTitle();
  }
  renderHud();
  fastMode = false;
}

// ===================== 키보드 =====================

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape"){
    if (overlayCloser) { overlayCloser(); e.preventDefault(); }
    return;
  }
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;

  if (activeKeyChoices.length && /^[1-4]$/.test(e.key)){
    const idx = Number(e.key) - 1;
    const btn = activeKeyChoices[idx];
    if (btn && !btn.disabled){ btn.click(); e.preventDefault(); }
    return;
  }
  if (e.key === "Enter" && !activeKeyChoices.length){
    if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
    if (primaryActionBtn && !primaryActionBtn.disabled){ primaryActionBtn.click(); e.preventDefault(); }
  }
});

// ===================== 시작 =====================

meta = loadMeta();
state = null;
route();

})();
</script>
